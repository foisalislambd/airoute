name: Release

# Push to main → read package.json version → build → publish only if all builds OK.
# Agents/maintainers bump versions before push (see AGENTS.md). CI never bumps.
# [skip release] in commit → nothing published.
# If v<version> tag already exists → skip (already released).
#
# Order (all-or-nothing):
#   decide → (npm-build ∥ docker-build) → publish (npm + Docker) → tag + GitHub Release LAST
# Any build failure cancels the rest of the run; nothing is tagged/released.
# If publish fails mid-way, later steps stop (GitHub Release is always last).
#
# Secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
# npmjs: Trusted Publisher (OIDC) — no NPM_TOKEN.
#   npmjs.com → airoute → Settings → Trusted Publisher → GitHub Actions:
#   user=foisalislambd  repo=airoute  workflow=release.yml  (filename only)
#   Allowed actions: npm publish

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  packages: write
  id-token: write

concurrency:
  group: airoute-release
  cancel-in-progress: true

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.decide.outputs.go }}
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
      sha: ${{ steps.decide.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          MSG: ${{ github.event.head_commit.message }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT" != "workflow_dispatch" ]; then
            if printf '%s\n' "${MSG:-}" | grep -qiE '\[skip[[:space:]]+release\]'; then
              echo "go=false" >> "$GITHUB_OUTPUT"
              echo "version=" >> "$GITHUB_OUTPUT"
              echo "tag=" >> "$GITHUB_OUTPUT"
              echo "sha=" >> "$GITHUB_OUTPUT"
              echo "Skipped: [skip release]"
              exit 0
            fi
          fi

          VERSION=$(node -p "require('./package.json').version")
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid package.json version: $VERSION" >&2
            exit 1
          fi
          TAG="v${VERSION}"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists — skip publish."
            exit 0
          fi

          echo "go=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Will build $TAG from $SHA; publish only if all builds succeed"

  npm-build:
    needs: decide
    if: needs.decide.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.decide.outputs.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm install -g npm@latest
      - run: npm ci --ignore-scripts --no-audit --no-fund

      - env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build + pack
        env:
          JWT_SECRET: ci-build-secret-with-sufficient-length-for-validation
          AIROUTE_USE_TURBOPACK: "0"
          OMNIROUTE_USE_TURBOPACK: "0"
          AIROUTE_BUILD_MEMORY_MB: "8192"
          OMNIROUTE_BUILD_MEMORY_MB: "8192"
        run: |
          set -euo pipefail
          npm run build:release
          npm run check:pack-artifact
          npm pack --ignore-scripts
          ls -la airoute-*.tgz

      - uses: actions/upload-artifact@v7
        with:
          name: npm-tarball
          path: airoute-*.tgz
          if-no-files-found: error
          retention-days: 1

      - name: Cancel run on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}" || true

  docker-build:
    needs: decide
    if: needs.decide.outputs.go == 'true'
    name: docker-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.decide.outputs.sha }}

      - id: img
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          O=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')
          echo "hub=${O}/airoute" >> "$GITHUB_OUTPUT"
          echo "ghcr=ghcr.io/${O}/airoute" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: base
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner-base
          platforms: ${{ matrix.platform }}
          outputs: type=image,"name=${{ steps.img.outputs.hub }},${{ steps.img.outputs.ghcr }}",push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,scope=docker-${{ matrix.arch }},mode=max
          build-args: AIROUTE_BUILD_MEMORY_MB=8192

      - id: web
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner-web
          platforms: ${{ matrix.platform }}
          outputs: type=image,"name=${{ steps.img.outputs.hub }},${{ steps.img.outputs.ghcr }}",push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=docker-web-${{ matrix.arch }}
          cache-to: type=gha,scope=docker-web-${{ matrix.arch }},mode=max
          build-args: AIROUTE_BUILD_MEMORY_MB=8192

      - name: Upload digests
        env:
          BASE: ${{ steps.base.outputs.digest }}
          WEB: ${{ steps.web.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$BASE" && test -n "$WEB"
          mkdir -p /tmp/d/base /tmp/d/web
          touch "/tmp/d/base/${BASE#sha256:}" "/tmp/d/web/${WEB#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-base-${{ matrix.arch }}
          path: /tmp/d/base/*
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v7
        with:
          name: digests-web-${{ matrix.arch }}
          path: /tmp/d/web/*
          if-no-files-found: error
          retention-days: 1

      - name: Cancel run on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}" || true

  publish:
    needs: [decide, npm-build, docker-build]
    if: needs.decide.outputs.go == 'true' && needs.npm-build.result == 'success' && needs.docker-build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.decide.outputs.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          # Do NOT set registry-url here: setup-node would write
          # `:_authToken=${NODE_AUTH_TOKEN}` and an empty token breaks OIDC.

      - run: npm install -g npm@latest

      - uses: actions/download-artifact@v8
        with:
          name: npm-tarball
          path: /tmp/npm

      - name: Publish npmjs
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          set -euo pipefail
          TGZ=$(ls /tmp/npm/airoute-*.tgz | head -n1)
          test -f "$TGZ"
          if [ "$(npm view "airoute@${VERSION}" version 2>/dev/null || true)" = "$VERSION" ]; then
            echo "airoute@${VERSION} already on npmjs — skip"
          else
            npm publish "$TGZ" --access public --tag latest
            echo "npmjs airoute@${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish GitHub Packages
        env:
          VERSION: ${{ needs.decide.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          O=$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          TGZ=$(ls /tmp/npm/airoute-*.tgz | head -n1)
          test -f "$TGZ"
          rm -rf /tmp/ghpkg
          mkdir -p /tmp/ghpkg
          tar -xzf "$TGZ" -C /tmp/ghpkg
          cd /tmp/ghpkg/package
          npm pkg set "name=@${O}/airoute"
          # .npmrc must live next to the package being published.
          printf '%s\n' \
            "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}" \
            "@${O}:registry=https://npm.pkg.github.com" > .npmrc
          npm publish --registry=https://npm.pkg.github.com --access public --tag latest
          echo "GitHub Packages @${O}/airoute@${VERSION}" >> "$GITHUB_STEP_SUMMARY"

      - id: img
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          O=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')
          echo "hub=${O}/airoute" >> "$GITHUB_OUTPUT"
          echo "ghcr=ghcr.io/${O}/airoute" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v8
        with:
          pattern: digests-base-*
          path: /tmp/d/base
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          pattern: digests-web-*
          path: /tmp/d/web
          merge-multiple: true

      - name: Docker manifests
        env:
          HUB: ${{ steps.img.outputs.hub }}
          GHCR: ${{ steps.img.outputs.ghcr }}
          VERSION: ${{ steps.img.outputs.version }}
        run: |
          set -euo pipefail
          mk() {
            local image="$1" suffix="$2" dir="$3"
            local args=(-t "${image}:${VERSION}${suffix}" -t "${image}:latest${suffix}")
            local refs=()
            while IFS= read -r f; do
              refs+=("${image}@sha256:$(basename "$f")")
            done < <(find "$dir" -type f | sort)
            [ "${#refs[@]}" -gt 0 ] || { echo "no digests in $dir" >&2; exit 1; }
            docker buildx imagetools create "${args[@]}" "${refs[@]}"
          }
          mk "$HUB" "" /tmp/d/base
          mk "$HUB" "-web" /tmp/d/web
          mk "$GHCR" "" /tmp/d/base
          mk "$GHCR" "-web" /tmp/d/web
          echo "Docker ${HUB}:${VERSION} (+ -web, :latest) → Hub + GHCR" >> "$GITHUB_STEP_SUMMARY"

      - name: Tag + GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.decide.outputs.tag }}
          VERSION: ${{ needs.decide.outputs.version }}
          SHA: ${{ needs.decide.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$SHA" -m "AIRoute ${VERSION}"
          git push origin "$TAG"
          gh release create "$TAG" --target "$SHA" --title "AIRoute ${VERSION}" --generate-notes
          echo "GitHub Release ${TAG} (last step)" >> "$GITHUB_STEP_SUMMARY"
