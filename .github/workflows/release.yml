name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write
  packages: write
  actions: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      packages: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compare package version with published releases
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release_plan.py

      - uses: actions/setup-node@v4
        if: steps.plan.outputs.release == 'true'
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-go@v5
        if: steps.plan.outputs.release == 'true'
        with:
          go-version-file: go.work

      - name: Build the panel
        if: steps.plan.outputs.release == 'true'
        run: |
          npm ci
          npm run build:panel

      - name: Build Windows, Linux, and macOS apps
        if: steps.plan.outputs.release == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: bash .github/scripts/build_apps.sh

      - name: Build the npm package
        if: steps.plan.outputs.release == 'true'
        run: node scripts/build_npm.mjs

      - name: Publish the Docker image
        if: steps.plan.outputs.release == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.plan.outputs.release == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: steps.plan.outputs.release == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push linux/amd64 and linux/arm64
        if: steps.plan.outputs.release == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            foisalislambd/airoute:latest
            foisalislambd/airoute:${{ steps.plan.outputs.version }}
            ghcr.io/foisalislambd/airoute:latest
            ghcr.io/foisalislambd/airoute:${{ steps.plan.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/foisalislambd/airoute
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish to npm and GitHub Packages
        if: steps.plan.outputs.release == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm install -g npm@latest
          npm --version
          node scripts/publish_npm.mjs

      - name: Create the GitHub release and tag
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "AIRoute $TAG" \
            --notes-file dist/release/notes.md \
            dist/release/AIRoute-*.zip
