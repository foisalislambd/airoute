name: Release

# Push to main → version + tag + GitHub Release + npm + Docker (one workflow).
# Commit message with [skip release] → exit early (nothing published).
# Manual: Actions → Release → Run workflow (optional version input).
#
# Secrets: NPM_TOKEN, DOCKERHUB_USERNAME, DOCKERHUB_TOKEN

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Empty = auto next version, or e.g. 1.2.0"
        required: false
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: airoute-release
  cancel-in-progress: false

jobs:
  # ── 1) Version, tag, GitHub Release ─────────────────────────────────────
  release:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.gate.outputs.go }}
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - name: Gate
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s\n' "${MSG:-}" | grep -qiE '\[skip[[:space:]]+release\]'; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "Skipped: [skip release] — no tag/npm/Docker."
            exit 0
          fi
          if printf '%s\n' "${MSG:-}" | head -n1 | grep -qE '^chore\(release\):'; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "Skipped: release bot commit."
            exit 0
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"

      - if: steps.gate.outputs.go == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.gate.outputs.go == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Version
        if: steps.gate.outputs.go == 'true'
        id: ver
        env:
          EVENT: ${{ github.event_name }}
          EXPLICIT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          CURRENT=$(node -p "require('./package.json').version")
          TAGS=$(git tag -l 'v[0-9]*' | tr '\n' ',' )

          if [ "$EVENT" = "workflow_dispatch" ] && [ -n "${EXPLICIT:-}" ]; then
            VERSION="${EXPLICIT#v}"
            if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "Invalid version: $EXPLICIT" >&2
              exit 1
            fi
          else
            VERSION=$(node scripts/release/next-version.mjs resolve "$CURRENT" "$TAGS")
          fi

          TAG="v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "$CURRENT → $VERSION"

      - name: Bump + changelog
        if: steps.gate.outputs.go == 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          node scripts/release/bump-version.mjs "$VERSION"
          node scripts/release/stamp-changelog.mjs "$VERSION"

      - name: Commit, tag, push
        if: steps.gate.outputs.go == 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json packages/*/package.json CHANGELOG.md || true
          if ! git diff --cached --quiet; then
            git commit -m "$(printf 'chore(release): %s\n\n[skip release]\n' "$VERSION")"
          fi
          git tag -a "$TAG" -m "AIRoute ${VERSION}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "$TAG"

      - name: GitHub Release
        if: steps.gate.outputs.go == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          gh release create "$TAG" --title "AIRoute ${VERSION}" --generate-notes
          echo "GitHub Release ${TAG}" >> "$GITHUB_STEP_SUMMARY"

  # ── 2) npm (npmjs + GitHub Packages) ────────────────────────────────────
  npm:
    needs: release
    if: needs.release.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ needs.release.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Version check
        id: ver
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          SKIP=false
          if [ "$(npm view "airoute@${VERSION}" version 2>/dev/null || true)" = "$VERSION" ]; then
            SKIP=true
          fi
          O=$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          echo "gh=@${O}/airoute" >> "$GITHUB_OUTPUT"

      - env:
          VERSION: ${{ needs.release.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build
        env:
          JWT_SECRET: ci-build-secret-with-sufficient-length-for-validation
          AIROUTE_USE_TURBOPACK: "0"
          OMNIROUTE_USE_TURBOPACK: "0"
          AIROUTE_BUILD_MEMORY_MB: "8192"
          OMNIROUTE_BUILD_MEMORY_MB: "8192"
        run: |
          npm run build:release
          npm run check:pack-artifact

      - name: Publish npmjs
        if: steps.ver.outputs.skip != 'true'
        env:
          VERSION: ${{ needs.release.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --provenance --access public --tag latest
          echo "npmjs airoute@${VERSION}" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Packages
        env:
          VERSION: ${{ needs.release.outputs.version }}
          NAME: ${{ steps.ver.outputs.gh }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          O=$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          printf '%s\n' \
            "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}" \
            "@${O}:registry=https://npm.pkg.github.com" > .npmrc
          npm pkg set "name=${NAME}"
          npm publish --registry=https://npm.pkg.github.com --access public --tag latest \
            || echo "GH Packages skipped/failed for ${NAME}@${VERSION}"
          echo "GitHub Packages ${NAME}@${VERSION}" >> "$GITHUB_STEP_SUMMARY"

  # ── 3) Docker digests (amd64 + arm64) ───────────────────────────────────
  docker-build:
    needs: release
    if: needs.release.outputs.go == 'true'
    name: docker-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ needs.release.outputs.tag }}

      - id: img
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          O=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')
          echo "hub=${O}/airoute" >> "$GITHUB_OUTPUT"
          echo "ghcr=ghcr.io/${O}/airoute" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: base
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner-base
          platforms: ${{ matrix.platform }}
          outputs: type=image,"name=${{ steps.img.outputs.hub }},${{ steps.img.outputs.ghcr }}",push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,scope=docker-${{ matrix.arch }},mode=max
          build-args: AIROUTE_BUILD_MEMORY_MB=8192

      - id: web
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner-web
          platforms: ${{ matrix.platform }}
          outputs: type=image,"name=${{ steps.img.outputs.hub }},${{ steps.img.outputs.ghcr }}",push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=docker-web-${{ matrix.arch }}
          cache-to: type=gha,scope=docker-web-${{ matrix.arch }},mode=max
          build-args: AIROUTE_BUILD_MEMORY_MB=8192

      - name: Upload digests
        env:
          BASE: ${{ steps.base.outputs.digest }}
          WEB: ${{ steps.web.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$BASE" && test -n "$WEB"
          mkdir -p /tmp/d/base /tmp/d/web
          touch "/tmp/d/base/${BASE#sha256:}" "/tmp/d/web/${WEB#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-base-${{ matrix.arch }}
          path: /tmp/d/base/*
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: digests-web-${{ matrix.arch }}
          path: /tmp/d/web/*
          if-no-files-found: error
          retention-days: 1

  # ── 4) Docker multi-arch manifests ──────────────────────────────────────
  docker-publish:
    needs: [release, docker-build]
    if: needs.release.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - id: img
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          O=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')
          echo "hub=${O}/airoute" >> "$GITHUB_OUTPUT"
          echo "ghcr=ghcr.io/${O}/airoute" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          pattern: digests-base-*
          path: /tmp/d/base
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: digests-web-*
          path: /tmp/d/web
          merge-multiple: true

      - name: Create manifests
        env:
          HUB: ${{ steps.img.outputs.hub }}
          GHCR: ${{ steps.img.outputs.ghcr }}
          VERSION: ${{ steps.img.outputs.version }}
        run: |
          set -euo pipefail
          mk() {
            local image="$1" suffix="$2" dir="$3"
            local args=(-t "${image}:${VERSION}${suffix}" -t "${image}:latest${suffix}")
            local refs=()
            while IFS= read -r f; do
              refs+=("${image}@sha256:$(basename "$f")")
            done < <(find "$dir" -type f | sort)
            [ "${#refs[@]}" -gt 0 ] || { echo "no digests in $dir" >&2; exit 1; }
            docker buildx imagetools create "${args[@]}" "${refs[@]}"
          }
          mk "$HUB" "" /tmp/d/base
          mk "$HUB" "-web" /tmp/d/web
          mk "$GHCR" "" /tmp/d/base
          mk "$GHCR" "-web" /tmp/d/web
          echo "Docker ${HUB}:${VERSION} (+ -web, :latest) → Hub + GHCR" >> "$GITHUB_STEP_SUMMARY"
