name: Publish npm

# Publishes `airoute` to:
#   1) https://registry.npmjs.org/airoute
#   2) https://npm.pkg.github.com/@<owner>/airoute
#
# Secrets: NPM_TOKEN (npmjs). GitHub Packages uses GITHUB_TOKEN.

on:
  # Driven by Release workflow via workflow_dispatch (and manual re-runs).
  # Not listening for `release` avoids double-publish if a PAT is used later.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.0.0 or 1.0.0-rc.1)"
        required: true
        type: string
      tag:
        description: "npm dist-tag"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - latest
          - next
          - historic

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PACKAGE_NAME: airoute

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      id-token: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure we are on the release tag contents
        # `gh workflow run --ref vX.Y.Z` already checks out the tag. When the
        # workflow is started from the UI on a branch, pin to refs/tags/vVERSION.
        if: github.event_name == 'workflow_dispatch'
        env:
          RAW: ${{ inputs.version }}
        run: |
          set -euo pipefail
          V="${RAW#v}"
          WANT="refs/tags/v${V}"
          if [ "${GITHUB_REF}" != "$WANT" ]; then
            git fetch --tags --force
            git checkout -B "release-${V}" "$WANT"
          fi

      - name: Setup Node.js (npmjs)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Resolve version, dist-tag, skip
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TAG: ${{ inputs.tag }}
          PACKAGE_NAME: ${{ env.PACKAGE_NAME }}
        run: |
          set -euo pipefail

          VERSION="${INPUT_VERSION:-}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            VERSION="$REF_NAME"
            VERSION="${VERSION#v}"
          fi
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$'; then
            echo "Refusing to publish unsafe VERSION value: $VERSION" >&2
            exit 1
          fi

          REQUESTED_TAG="${INPUT_TAG:-auto}"
          TAG="$REQUESTED_TAG"
          if [ "$TAG" = "auto" ] || [ -z "$TAG" ]; then
            if printf '%s' "$VERSION" | grep -qE -- '-(rc|alpha|beta|pre|next)'; then
              TAG="next"
            else
              git fetch --tags --quiet || true
              HIGHEST=$(git tag -l 'v[0-9]*' | sed 's/^v//' | grep -vE -- '-(rc|alpha|beta|pre|next)' | sort -V | tail -1 || echo "")
              if [ -n "$HIGHEST" ] && [ "$VERSION" = "$HIGHEST" ]; then
                TAG="latest"
              elif [ -z "$HIGHEST" ]; then
                TAG="latest"
              else
                echo "Version $VERSION is not the highest semver (highest=${HIGHEST}). Using dist-tag 'historic'."
                TAG="historic"
              fi
            fi
          fi

          PUBLISHED="$(npm view "${PACKAGE_NAME}@${VERSION}" version 2>/dev/null || true)"
          SKIP="false"
          if [ "$PUBLISHED" = "$VERSION" ]; then
            echo "⚠️ ${PACKAGE_NAME}@${VERSION} already on npmjs — skipping npmjs publish."
            SKIP="true"
          fi

          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "skip_npmjs=$SKIP" >> "$GITHUB_OUTPUT"
          echo "gh_pkg_name=@${OWNER}/${PACKAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "📦 Resolved ${PACKAGE_NAME}@$VERSION dist-tag=$TAG skip_npmjs=$SKIP"

      - name: Sync package.json version
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build release artifact
        env:
          JWT_SECRET: ci-build-secret-with-sufficient-length-for-validation
          AIROUTE_USE_TURBOPACK: "0"
          OMNIROUTE_USE_TURBOPACK: "0"
          AIROUTE_BUILD_MEMORY_MB: "8192"
          OMNIROUTE_BUILD_MEMORY_MB: "8192"
        run: npm run build:release

      - name: Validate pack artifact
        run: npm run check:pack-artifact

      - name: Publish to npmjs.org
        if: steps.resolve.outputs.skip_npmjs != 'true'
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          TAG: ${{ steps.resolve.outputs.tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          npm publish --provenance --access public --tag "$TAG"
          echo "✅ Published airoute@$VERSION to npmjs (dist-tag=$TAG)" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to GitHub Packages
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          TAG: ${{ steps.resolve.outputs.tag }}
          GH_PKG_NAME: ${{ steps.resolve.outputs.gh_pkg_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}" > .npmrc
          echo "@$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]'):registry=https://npm.pkg.github.com" >> .npmrc
          npm pkg set "name=${GH_PKG_NAME}"
          if npm publish --registry=https://npm.pkg.github.com --access public --tag "$TAG"; then
            echo "✅ Published ${GH_PKG_NAME}@$VERSION to GitHub Packages (dist-tag=$TAG)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ GitHub Packages publish failed or already exists for ${GH_PKG_NAME}@$VERSION" >> "$GITHUB_STEP_SUMMARY"
          fi
