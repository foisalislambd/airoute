name: Feature request
description: An idea for WowRouter
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the task you cannot do today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What should WowRouter do?
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, related docs, or a smaller version of the idea.
